<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#060B14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{
  --void:#060B14; --panel:#0E1B2B; --panel2:#122539;
  --cyan:#48E5C2; --violet:#A16BFF; --amber:#E8A23D; --coral:#FF6B6B;
  --text:#D8E6E4; --text-dim:#8AA3A0; --accent: var(--cyan);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:#000;}
body{font-family:'Manrope',sans-serif; color:var(--text); display:flex; justify-content:center; align-items:center; min-height:100vh; overflow:hidden;}
.display{font-family:'Marcellus',serif;}
#phone{position:relative; width:420px; max-width:100vw; height:860px; max-height:100vh;
  background:radial-gradient(ellipse at 50% -10%, #0d2233 0%, var(--void) 55%, #030509 100%);
  border-radius:38px; overflow:hidden; box-shadow:0 0 0 8px #000, 0 0 60px rgba(72,229,194,0.15), 0 30px 80px rgba(0,0,0,0.6);
  display:flex; flex-direction:column;}
#spores{position:absolute; inset:0; pointer-events:none; z-index:1; overflow:hidden;}
.spore{position:absolute; bottom:-20px; border-radius:50%;
  background:radial-gradient(circle, rgba(72,229,194,0.95) 0%, rgba(72,229,194,0.15) 60%, transparent 70%);
  box-shadow:0 0 8px 2px rgba(72,229,194,0.5); animation: floatUp linear infinite;}
@keyframes floatUp{0%{transform:translate(0,0); opacity:0;}10%{opacity:0.9;}90%{opacity:0.6;}100%{transform:translate(var(--dx),-920px); opacity:0;}}
#statusbar{height:28px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:0 22px; font-size:11px; color:var(--text-dim); letter-spacing:1px; z-index:5;}
#app{position:relative; z-index:4; flex:1; overflow-y:auto; padding:18px 20px 26px; scrollbar-width:none;}
#app::-webkit-scrollbar{display:none;}
.eyebrow{font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--accent); opacity:0.85; margin-bottom:6px; font-weight:700;}
h1.title{font-family:'Marcellus',serif; font-size:34px; line-height:1.1; margin:0 0 4px;
  background:linear-gradient(120deg, var(--cyan), var(--violet)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.tagline{color:var(--text-dim); font-size:13.5px; margin-bottom:26px; line-height:1.5;}
.btn{display:block; width:100%; text-align:left; background:var(--panel); border:1px solid rgba(72,229,194,0.18); color:var(--text);
  padding:16px 18px; border-radius:16px; font-size:15px; font-weight:600; margin-bottom:12px; cursor:pointer; transition:all .18s ease; position:relative; overflow:hidden; font-family:'Manrope',sans-serif;}
.btn:active{transform:scale(0.98);}
.btn:hover{border-color:var(--accent); box-shadow:0 0 18px rgba(72,229,194,0.15);}
.btn .sub{display:block; font-weight:400; font-size:12px; color:var(--text-dim); margin-top:4px;}
.btn.primary{background:linear-gradient(120deg, rgba(72,229,194,0.18), rgba(161,107,255,0.14)); border-color:var(--accent);}
.btn.ghost{background:transparent; border:1px solid rgba(216,230,228,0.15);}
.btn.danger{border-color:rgba(255,107,107,0.4);}
.btn .pct{float:right; font-size:11px; padding:3px 9px; border-radius:20px; font-weight:800; background:rgba(72,229,194,0.12); color:var(--accent);}
.card{background:var(--panel); border:1px solid rgba(255,255,255,0.06); border-radius:18px; padding:18px; margin-bottom:16px;}
#topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.badge{font-size:11px; letter-spacing:1.5px; text-transform:uppercase; font-weight:800; padding:5px 11px; border-radius:20px; border:1px solid var(--accent); color:var(--accent);}
.age-display{font-family:'Marcellus',serif; font-size:20px; color:var(--text);}
.age-display b{color:var(--accent);}
.stats-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}
.stat{background:var(--panel2); border-radius:12px; padding:9px 11px;}
.stat .lbl{display:flex; justify-content:space-between; font-size:10.5px; color:var(--text-dim); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.5px;}
.stat .lbl b{color:var(--text);}
.bar{height:6px; border-radius:4px; background:rgba(255,255,255,0.07); overflow:hidden;}
.bar i{display:block; height:100%; border-radius:4px; background:linear-gradient(90deg,var(--cyan),var(--violet)); box-shadow:0 0 6px rgba(72,229,194,0.6);}
.event-text{font-size:15px; line-height:1.65; margin-bottom:18px; color:var(--text);}
.event-text .stagelabel{display:block; font-family:'Marcellus',serif; font-size:19px; color:var(--accent); margin-bottom:8px;}
.outcome{border-left:3px solid var(--accent); padding:12px 14px; background:rgba(72,229,194,0.06); border-radius:0 12px 12px 0; margin-bottom:14px; font-size:14px; line-height:1.55;}
.outcome.fail{border-color:var(--coral); background:rgba(255,107,107,0.07);}
.deltas{margin-top:8px; display:flex; flex-wrap:wrap; gap:6px;}
.delta-pill{font-size:11px; padding:3px 8px; border-radius:20px; background:rgba(255,255,255,0.06); font-weight:700;}
.delta-pill.pos{color:var(--cyan);} .delta-pill.neg{color:var(--coral);} .delta-pill.score{color:var(--amber);}
.recap{background:var(--panel2); border-radius:14px; padding:12px 14px; margin-bottom:16px;}
.recap .recap-title{font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:var(--accent); font-weight:800; margin-bottom:8px;}
.recap-line{font-size:12.5px; color:var(--text-dim); margin-bottom:4px;}
.recap-line b{color:var(--text);}
.recap-stats{font-size:12px; color:var(--text-dim); line-height:1.7;}
.journal-toggle{font-size:12px; color:var(--text-dim); text-align:center; cursor:pointer; margin:16px 0 4px; letter-spacing:1px; text-transform:uppercase;}
.journal{display:none; margin-top:8px;} .journal.open{display:block;}
.journal-entry{font-size:12.5px; color:var(--text-dim); padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.05);}
.journal-entry b{color:var(--text);}
.inputwrap{margin-bottom:18px;}
.inputwrap label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:1px;}
input[type=text]{width:100%; background:var(--panel2); border:1px solid rgba(255,255,255,0.08); color:var(--text); padding:13px 14px; border-radius:12px; font-size:15px; font-family:'Manrope',sans-serif;}
input[type=text]:focus{outline:none; border-color:var(--accent);}
.center{text-align:center;}
.small{font-size:12px; color:var(--text-dim);}
.epi-title{font-family:'Marcellus',serif; font-size:26px; color:var(--accent); margin:6px 0 2px;}
.hr{height:1px; background:linear-gradient(90deg, transparent, rgba(255,255,255,0.14), transparent); margin:18px 0;}
.mem-card{background:var(--panel); border-radius:14px; padding:14px 16px; margin-bottom:10px; border:1px solid rgba(255,255,255,0.06);}
.mem-card .name{font-family:'Marcellus',serif; font-size:17px; color:var(--text);}
.mem-card .meta{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
.mem-card .del{float:right; color:var(--coral); font-size:11px; cursor:pointer;}
.mem-card.locked{opacity:0.4;}
.mem-card .cnt{float:right; font-size:11px; color:var(--accent); font-weight:800;}
.score-banner{background:linear-gradient(120deg, rgba(232,162,61,0.16), rgba(161,107,255,0.12)); border:1px solid rgba(232,162,61,0.35);
  border-radius:14px; padding:12px 14px; margin-bottom:16px; text-align:center;}
.score-banner b{font-family:'Marcellus',serif; font-size:22px; color:var(--amber); display:block;}
.species-navi{--accent:var(--violet);} .species-humain{--accent:var(--amber);}
::selection{background:rgba(72,229,194,0.3);}
</style>
</head>
<body>
<div id="phone">
  <div id="spores"></div>
  <div id="statusbar"><span>PANDORA · RSPN-01</span><span id="clock">◐</span></div>
  <div id="app"></div>
</div>
<input type="file" id="importFileInput" accept="application/json,.json" style="display:none" onchange="handleImportFile(this)">

<script>
/* ============================= DONNÉES DE BASE ============================= */

const STAT_KEYS = ["force","courage","sagesse","harmonie","charme","chance"];
const STAT_LABELS = {force:"Force", courage:"Courage", sagesse:"Sagesse", harmonie:"Harmonie", charme:"Charme", chance:"Chance"};

const NAVI_NAMES_F = ["Neytiri","Mo'at","Ronal","Tsireya","Sylwanin"];
const NAVI_NAMES_M = ["Tsu'tey","Eytukan","Tonowari","Aonung","Rotxo"];
const HUMAN_NAMES_F = ["Grace","Trudy","Frances","Karina"];
const HUMAN_NAMES_M = ["Jake","Norm","Max","Parker","Miles","Ian","Lyle"];
const CHILD_NAMES_NAVI = ["Neteyam","Lo'ak","Kiri","Tuk"];
const CHILD_NAMES_HUMAN = ["Max","Grace","Norm","Ian","Karina"];

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function clamp(v){ return Math.max(0, Math.min(100, Math.round(v))); }
function randInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function namePool(species, gender){ return species==='navi' ? (gender==='F'?NAVI_NAMES_F:NAVI_NAMES_M) : (gender==='F'?HUMAN_NAMES_F:HUMAN_NAMES_M); }
/* Le/la partenaire est du genre opposé à celui du joueur. */
function spousePool(state, spouseSpecies){ return namePool(spouseSpecies, state.gender==='F' ? 'H' : 'F'); }
function spouseNoun(state){ return state.gender==='F' ? "un mari" : "une femme"; }
function spouseNounCap(state){ return state.gender==='F' ? "Un mari" : "Une femme"; }

/* Génération combinatoire pour les années calmes : évite quasiment toute répétition
   de texte au sein d'une même vie (des centaines de combinaisons possibles). */
const FLAVOR_OPENERS_NAVI = ["Le vent souffle dans les arbres.","La lune de Pandora éclaire la nuit.","Un chant lointain traverse le camp.","Il pleut sur les grandes feuilles, comme souvent.","Le clan vaque à ses occupations habituelles.","Les bioluminescences brillent au sol, ce soir-là.","Une brume traîne autour de l'Arbre-Maison."];
const FLAVOR_MIDDLES_NAVI = ["Tu passes ton temps entre chasse et repos.","Rien de particulier ne se passe cette année.","Tu apprends encore quelques petites choses, comme d'habitude.","Le quotidien du clan continue, tranquillement.","Tu regardes le monde changer petit à petit.","Les saisons passent, sans grand bruit.","Tu prends soin de toi et des tiens, ce qui n'est déjà pas rien."];
const FLAVOR_CLOSERS_NAVI = ["Encore une année qui passe.","Il ne se passe rien de marquant, mais tu avances quand même.","Le temps continue son cours, simplement.","Cela te change un peu, sans plus.","La vie continue.","Un souvenir de plus, parmi d'autres.","Il n'y a pas grand-chose à en dire, en réalité."];
const FLAVOR_OPENERS_HUMAN = ["Les néons de la base clignotent.","Un nouveau mois commence.","La routine reprend sur Pandora.","Les rapports s'entassent sur ton bureau.","Un vaisseau de ravitaillement se pose au loin.","La pluie frappe contre les hublots.","Un message de la Terre met des mois à arriver, comme toujours."];
const FLAVOR_MIDDLES_HUMAN = ["Tu passes ton temps entre travail et repos.","Rien de particulier ne se passe cette année.","Tu apprends encore quelques petites choses, comme d'habitude.","Le quotidien continue, sans grand bruit.","Tu regardes le monde changer petit à petit.","Les mois passent, tranquillement.","Tu prends soin de toi et des tiens, ce qui n'est déjà pas rien."];
const FLAVOR_CLOSERS_HUMAN = ["Encore une année loin de la Terre.","Il ne se passe rien de marquant, mais tu avances quand même.","Le temps continue son cours, simplement.","Cela te change un peu, sans plus.","La vie continue.","Un souvenir de plus, parmi d'autres.","Pandora te façonne, doucement."];

function autoFlavor(state){
  const openers = state.species==='navi'?FLAVOR_OPENERS_NAVI:FLAVOR_OPENERS_HUMAN;
  const middles = state.species==='navi'?FLAVOR_MIDDLES_NAVI:FLAVOR_MIDDLES_HUMAN;
  const closers = state.species==='navi'?FLAVOR_CLOSERS_NAVI:FLAVOR_CLOSERS_HUMAN;
  state.usedFlavors = state.usedFlavors || [];
  let combo, tries=0;
  do{ combo = pick(openers)+" "+pick(middles)+" "+pick(closers); tries++; }
  while(state.usedFlavors.includes(combo) && tries<40);
  state.usedFlavors.push(combo);
  return combo;
}

/* Générateur de secours (générique mais jamais répété dans une même vie) utilisé
   uniquement quand tous les événements écrits pour une tranche d'âge ont déjà été vus.
   Plusieurs familles de choix bien distinctes, combinées à des sujets variés,
   pour qu'aucune "année de secours" ne ressemble jamais vraiment à une autre. */
const GENERIC_SUBJECTS_NAVI = ["une dispute avec un ami du clan","une corvée fastidieuse","un rêve étrange qui te hante","une nouvelle rencontre inattendue","un défi physique surprenant","une question qui te trotte dans la tête","un moment de doute passager","une petite victoire personnelle","un désaccord avec un proche","une occasion de te distinguer","une nuit d'orage difficile à trouver le sommeil","une blessure légère à soigner","une rumeur qui circule sur toi","un objet mystérieux trouvé en forêt","une invitation à une cérémonie voisine","un souvenir d'enfance qui remonte","une maladresse publique","un signe qui semble venir d'Eywa","une proposition inattendue d'un proche","un silence pesant avec quelqu'un que tu aimes"];
const GENERIC_SUBJECTS_HUMAN = ["une dispute avec un collègue","une tâche fastidieuse","un rêve étrange qui te hante","une nouvelle rencontre inattendue","un défi physique surprenant","une question qui te trotte dans la tête","un moment de doute passager","une petite victoire personnelle","un désaccord avec un proche","une occasion de te distinguer","une panne de matériel à gérer","une blessure légère à soigner","une rumeur qui circule sur toi","un objet mystérieux retrouvé dans un tiroir","une invitation à un événement de la base","un souvenir d'enfance qui remonte","une maladresse publique","un message énigmatique reçu","une proposition inattendue d'un proche","un silence pesant avec quelqu'un que tu aimes"];

const GENERIC_TEMPLATES = [
  (subj)=>({title:"Une année particulière", text:s=>`Cette année-là, ${subj} occupe l'esprit de ${s.name}.`,
    choices:[
      {label:"Foncer sans hésiter", chance:65, chanceStat:'courage',
       success:{text:"Ton audace paie, cette fois.", deltas:{courage:4,chance:1}},
       fail:{text:"Ça ne se passe pas comme prévu, mais tu en tires une leçon.", deltas:{courage:-1,sagesse:1}}},
      {label:"Réfléchir soigneusement avant d'agir", success:{text:"Ta prudence porte ses fruits.", deltas:{sagesse:4}}},
      {label:"Chercher du soutien auprès des autres", success:{text:"Tu n'affrontes pas ça seul(e).", deltas:{charme:4}}},
      {label:"Laisser le temps faire les choses", success:{text:"Parfois, il suffit d'attendre un peu.", deltas:{harmonie:4}}},
    ]}),
  (subj)=>({title:"Un choix à faire", text:s=>`${s.name} se retrouve confronté(e) à ${subj}, et doit trancher.`,
    choices:[
      {label:"Confronter la situation directement", chance:55, chanceStat:'courage',
       success:{text:"Ta franchise désamorce les choses.", deltas:{courage:3,charme:2}},
       fail:{text:"Ça envenime un peu les choses, mais tu assumes.", deltas:{harmonie:-2,sagesse:1}}},
      {label:"Éviter soigneusement le sujet", success:{text:"Tu préfères ne pas t'en mêler pour l'instant.", deltas:{chance:2}}},
      {label:"Négocier un compromis raisonnable", success:{text:"Un terrain d'entente se dessine.", deltas:{sagesse:3,charme:2}}},
      {label:"Repousser la décision à plus tard", success:{text:"Tu te donnes le temps d'y réfléchir.", deltas:{sagesse:2}}},
    ]}),
  (subj)=>({title:"Une question de priorités", text:s=>`Avec ${subj}, ${s.name} doit décider où porter son énergie.`,
    choices:[
      {label:"Investir sur toi-même", success:{text:"Tu progresses discrètement, mais sûrement.", deltas:{sagesse:3,force:2}}},
      {label:"Investir dans tes proches", success:{text:"Vos liens se renforcent.", deltas:{harmonie:3,charme:2}}},
      {label:"Investir dans ton travail ou ton rôle", success:{text:"Ton engagement est remarqué.", deltas:{chance:3}, reputationDelta:2}},
      {label:"Ne rien changer à tes habitudes", success:{text:"Tu restes fidèle à ta routine.", deltas:{harmonie:2}}},
    ]}),
  (subj)=>({title:"Un pari à prendre ou pas", text:s=>`${subj} met ${s.name} face à un vrai dilemme.`,
    choices:[
      {label:"Tout risquer pour en avoir le cœur net", chance:45, chanceStat:'chance',
       success:{text:"Le risque était calculé, et ça paie.", deltas:{chance:6}},
       fail:{text:"Le pari échoue, mais tu ne regrettes pas d'avoir essayé.", deltas:{chance:-3,sagesse:2}}},
      {label:"Jouer la carte de la prudence", success:{text:"Tu avances pas à pas, sans surprise.", deltas:{sagesse:3}}},
      {label:"Demander l'avis de quelqu'un de confiance", success:{text:"Un regard extérieur t'aide à y voir clair.", deltas:{charme:3}}},
      {label:"Suivre ton instinct, sans trop réfléchir", success:{text:"Tu te fies à ce que tu ressens.", deltas:{courage:3}}},
    ]}),
  (subj)=>({title:"Accepter ou refuser", text:s=>`Face à ${subj}, on demande à ${s.name} de se positionner clairement.`,
    choices:[
      {label:"Accepter pleinement", success:{text:"Tu t'engages sans réserve.", deltas:{courage:3,charme:1}}},
      {label:"Refuser fermement", success:{text:"Tu assumes ton choix, quitte à déplaire.", deltas:{sagesse:2}, reputationDelta:-1}},
      {label:"Proposer une alternative à mi-chemin", success:{text:"Ta solution surprend, mais convainc.", deltas:{sagesse:2,charme:2}}},
      {label:"Demander un délai de réflexion", success:{text:"Personne ne t'en tient rigueur.", deltas:{sagesse:2}}},
    ]}),
  (subj)=>({title:"Un moment à vivre pleinement", text:s=>`${subj} devient, pour ${s.name}, l'occasion de se recentrer.`,
    choices:[
      {label:"T'y plonger corps et âme", success:{text:"Tu en ressors transformé(e), même un peu.", deltas:{harmonie:3,courage:2}}},
      {label:"Garder une distance raisonnable", success:{text:"Tu observes sans t'impliquer à fond.", deltas:{sagesse:3}}},
      {label:"En faire un moment de partage", success:{text:"Tu ne vis pas ça seul(e).", deltas:{charme:3,harmonie:1}}},
      {label:"En tirer une leçon discrète", success:{text:"Tu notes ce que ça t'apprend sur toi-même.", deltas:{sagesse:2,chance:1}}},
    ]}),
  (subj)=>({title:"Un secret à garder ou révéler", text:s=>`${subj} met ${s.name} dans la confidence de quelque chose de délicat.`,
    choices:[
      {label:"Garder ce secret pour toi", success:{text:"Tu apprends à porter ce poids seul(e).", deltas:{sagesse:3}}},
      {label:"Le révéler à un proche de confiance", success:{text:"Le partager t'allège beaucoup.", deltas:{charme:3,harmonie:1}}},
      {label:"Le révéler publiquement", chance:45, chanceStat:'courage',
       success:{text:"La vérité, une fois dite, libère tout le monde.", deltas:{courage:4}, reputationDelta:3},
       fail:{text:"Ça crée plus de remous que prévu.", reputationDelta:-3, deltas:{sagesse:1}}},
      {label:"T'en défaire autrement, sans le dire à personne", success:{text:"Tu trouves ta propre façon d'avancer.", deltas:{chance:2}}},
    ]}),
  (subj)=>({title:"Le poids d'une routine", text:s=>`${subj} pousse ${s.name} à interroger ses habitudes.`,
    choices:[
      {label:"Tout changer radicalement", chance:45, chanceStat:'courage',
       success:{text:"Ce grand changement te fait un bien fou.", deltas:{courage:4,chance:2}},
       fail:{text:"Le changement est plus difficile que prévu à tenir.", deltas:{courage:-1,sagesse:2}}},
      {label:"Ajuster légèrement tes habitudes", success:{text:"De petits ajustements suffisent amplement.", deltas:{sagesse:3}}},
      {label:"Ne rien changer du tout", success:{text:"Tu restes fidèle à ce qui fonctionne déjà.", deltas:{harmonie:2}}},
      {label:"En discuter avec quelqu'un de proche", success:{text:"Ce regard extérieur t'éclaire.", deltas:{charme:3}}},
    ]}),
  (subj)=>({title:"Une aide à apporter ou pas", text:s=>`${subj} place ${s.name} devant une demande d'aide.`,
    choices:[
      {label:"Aider sans compter ton temps", success:{text:"Ton dévouement est remarqué et apprécié.", deltas:{charme:3,harmonie:1}}, reputationDelta:2},
      {label:"Aider, mais avec mesure", success:{text:"Un juste équilibre entre don et préservation de soi.", deltas:{sagesse:3}}},
      {label:"Décliner poliment cette fois", success:{text:"Tu as aussi le droit de dire non.", deltas:{sagesse:2}}},
      {label:"Trouver quelqu'un d'autre pour aider à ta place", success:{text:"Ta solution satisfait tout le monde.", deltas:{charme:2,chance:1}}},
    ]}),
  (subj)=>({title:"Un héritage à transmettre", text:s=>`${subj} amène ${s.name} à réfléchir à ce qu'il/elle laissera derrière lui/elle.`,
    choices:[
      {label:"Transmettre dès maintenant, sans attendre", success:{text:"Un geste généreux, salué de tous.", deltas:{charme:3}, reputationDelta:3}},
      {label:"Attendre le bon moment", success:{text:"Tu préfères ne pas te précipiter.", deltas:{sagesse:3}}},
      {label:"Transmettre à quelqu'un d'inattendu", success:{text:"Ton choix surprend, mais fait sens avec le recul.", deltas:{chance:3,charme:1}}},

function genericYearStage(state, age, bracket){
  bracket = bracket || 'adulte';
  const subjects = state.species==='navi'?GENERIC_SUBJECTS_NAVI:GENERIC_SUBJECTS_HUMAN;
  state.usedSubjects = state.usedSubjects || {};
  state.usedSubjects[bracket] = state.usedSubjects[bracket] || [];
  let availSubj = subjects.filter(s=>!state.usedSubjects[bracket].includes(s));
  const subj = availSubj.length ? pick(availSubj) : pick(subjects);
  state.usedSubjects[bracket].push(subj);

  state.usedTemplates = state.usedTemplates || {};
  state.usedTemplates[bracket] = state.usedTemplates[bracket] || [];
  let availTpl = GENERIC_TEMPLATES.map((fn,i)=>i).filter(i=>!state.usedTemplates[bracket].includes(i));
  const tplIndex = availTpl.length ? pick(availTpl) : pick(GENERIC_TEMPLATES.map((fn,i)=>i));
  state.usedTemplates[bracket].push(tplIndex);
  if(state.usedTemplates[bracket].length >= GENERIC_TEMPLATES.length){ state.usedTemplates[bracket] = []; }

  const built = GENERIC_TEMPLATES[tplIndex](subj);
  return {id:'gen_'+age, age, tier:'filler', title:built.title, text:built.text, choices:built.choices};
}

/* Espérance de vie : évolue en fonction des choix (dangers affrontés, sagesse et harmonie
   accumulées...), toujours bornée pour rester crédible. */
function adjustLifespan(state, delta){
  const baseline = state.species==='navi' ? 92 : 80;
  const ceiling = baseline + 15;
  const floor = Math.max(state.age+2, 30);
  state.maxAge = Math.max(floor, Math.min(state.maxAge+delta, ceiling));
}

/* Les 3 voies : chaque personnage penche vers l'une d'elles une fois son "métier" choisi.
   Progresser dans les stats de sa propre voie est plus facile ; progresser ailleurs, plus dur. */
const ARCHETYPE_STATS = {
  force: ['force','courage'],
  sagesse: ['sagesse','harmonie'],
  chance: ['charme','chance'],
};

/* Une chute, un combat, un effort physique risqué : plus la force et le courage sont bas,
   plus le danger de mort qui en découle est réel. */
function deathChanceMultiplier(state, chanceStat){
  if(chanceStat!=='force' && chanceStat!=='courage') return 1;
  const avg = (state.stats.force + state.stats.courage) / 2;
  if(avg<=15) return 3.5;
  if(avg<=30) return 2.5;
  if(avg<=45) return 1.6;
  if(avg<=60) return 1;
  if(avg<=75) return 0.6;
  return 0.35;
}

function applyOutcome(state, outc, hadRisk, success, chanceStat){
  if(!outc) return;
  let scoreGain = 0;
  if(outc.deltas){
    for(const k in outc.deltas){
      let d = outc.deltas[k];
      if(d>0){
        if(k==='sagesse'){
          /* La sagesse est de plus en plus difficile à gagner à mesure qu'elle est déjà élevée
             (retours décroissants), pour éviter qu'elle grimpe sans effort. */
          const cur = state.stats.sagesse;
          const factor = cur>=80 ? 0.25 : cur>=60 ? 0.45 : cur>=40 ? 0.7 : 1;
          d = d*factor;
        }
        if(state.flags.archetype){
          /* Dans sa propre voie, les progrès viennent plus vite ; ailleurs, ils coûtent plus cher. */
          const primary = ARCHETYPE_STATS[state.flags.archetype] || [];
          d = d * (primary.includes(k) ? 1.3 : 0.6);
        }
        d = Math.round(d);
      }
      state.stats[k]=clamp(state.stats[k]+d);
      scoreGain += d;
    }
    if((outc.deltas.harmonie||0)>=6 || (outc.deltas.sagesse||0)>=6) adjustLifespan(state, 1);
    if((outc.deltas.force||0)<=-4 || (outc.deltas.courage||0)<=-4) adjustLifespan(state, -1);
  }
  if(outc.reputationDelta){ state.reputation += outc.reputationDelta; scoreGain += outc.reputationDelta*2; }
  const fam = typeof outc.family==='function' ? outc.family(state) : outc.family;
  if(fam) Object.assign(state.family, fam);
  const fl = typeof outc.flags==='function' ? outc.flags(state) : outc.flags;
  if(fl){
    Object.assign(state.flags, fl);
    if(fl.chef) scoreGain += 50;
    if(fl.tsahik) scoreGain += 50;
    if(fl.ikranEpique) scoreGain += 40;
    if(fl.deserteur) scoreGain += 25;
    if(fl.paixLocale) scoreGain += 25;
  }
  if(outc.becomeNavi){
    state.species='navi';
    adjustLifespan(state, 10);
    state.flags.devenuNavi=true;
    state.flags.devenuNaviDecided=true;
    state.flags.origine = "Adopté(e) du Peuple";
    state.flags.clanName = "le Peuple";
    state.needsNaviRebuild = true;
    scoreGain += 40;
  }
  if(hadRisk){
    scoreGain += 5;
    adjustLifespan(state, -1);
    /* Se lancer dans une action risquée (pas une démarche réfléchie) et échouer coûte
       un peu de sagesse : c'est la seule vraie façon d'en perdre. */
    if(success===false && chanceStat && chanceStat!=='sagesse'){
      const loss = randInt(1,3);
      state.stats.sagesse = clamp(state.stats.sagesse - loss);
      scoreGain -= loss;
    }
  }
  state.score = Math.round((state.score||0) + scoreGain);
  if(outc.deathChance){
    const effectiveDeathChance = Math.min(65, outc.deathChance * deathChanceMultiplier(state, chanceStat));
    if(Math.random()*100 < effectiveDeathChance){
      state.alive = false;
      state.deathText = outc.deathText || "La vie s'achève ici, brutalement.";
    }
  }
}

function pushHistory(state, text){ state.history.push({age:state.age, text}); }

/* CORRECTIF : un échec ne doit JAMAIS appliquer les effets d'une réussite.
   Sans "fail" explicite, on retombe sur un résultat neutre mais jamais nul (chaque choix compte). */
function resolveChoice(state, stage, choice){
  let success = true;
  const hadRisk = choice.chance != null;
  if(hadRisk){
    let ch = choice.chance;
    /* Les statistiques influencent vraiment la probabilité de réussite : plus la stat
       liée au choix est haute, plus les chances de réussir grimpent (et inversement). */
    if(choice.chanceStat){ ch += (state.stats[choice.chanceStat]-50)*0.5; }
    ch = Math.max(5, Math.min(96, ch));
    success = Math.random()*100 < ch;
  }
  let outc;
  if(success){ outc = choice.success; }
  else { outc = choice.fail || {text:"Cette tentative échoue, sans grande conséquence directe.", deltas:{}}; }
  applyOutcome(state, outc, hadRisk, hadRisk?success:null, choice.chanceStat);
  const text = (typeof outc.text === 'function') ? outc.text(state) : outc.text;
  pushHistory(state, (typeof choice.label==='function'?choice.label(state):choice.label) + " — " + text);
  return {success, text, deltas:outc.deltas||{}, reputationDelta:outc.reputationDelta||0, dead: !state.alive, deathText: state.deathText};
}

function getChoices(stage, state){ return typeof stage.choices==='function' ? stage.choices(state) : stage.choices; }
function markMilestones(arr){ return arr.map(s=>Object.assign({}, s, {milestone:true})); }

function makeLoveRetryStage(state, age){
  const noun = spouseNoun(state);
  const spSpecies = state.species; // cherche généralement dans son propre monde
  const intros = [
    `${state.name} n'a toujours pas trouvé ${noun}. Une nouvelle occasion se présente peut-être cette année.`,
    `Le temps passe, et ${state.name} pense encore à trouver ${noun}.`,
    `Une rencontre imprévue relance chez ${state.name} l'espoir de trouver ${noun}.`,
    `${state.name} se surprend à espérer encore trouver ${noun}, un jour.`,
  ];
  const intro = pick(intros);
  return {id:'loveretry_'+age, age, tier:'core',
    title:"Toujours en quête d'amour",
    text:()=>intro,
    choices:[
      {label:`Retenter ta chance de trouver ${noun}`, chance:60, chanceStat:'charme',
       success:{text:"Cette fois, la rencontre est la bonne.", family:s=>({married:true, spouseName:pick(spousePool(s, spSpecies)), spouseSpecies:spSpecies}), deltas:{harmonie:6,charme:4}, flags:{lastLoveAttemptAge:age}},
       fail:{text:"Toujours pas. Tu ne perds pas espoir pour autant.", deltas:{charme:-1,sagesse:1}, flags:{lastLoveAttemptAge:age}}},
      {label:"Continuer à chercher activement, sans forcer", success:{text:"Tu multiplies les rencontres, sans succès pour l'instant.", deltas:{chance:2}, flags:{lastLoveAttemptAge:age}}},

      {label:"Renoncer définitivement à trouver l'amour", success:{text:"Tu fais la paix avec une vie sans partenaire.", deltas:{sagesse:4}, flags:{seekingLove:false, lastLoveAttemptAge:age}}},

}
function makeBecomeNaviRetryStage(state, age){
  const intros = [

/* Cycler qui NE reboucle JAMAIS : une fois le contenu épuisé, il renvoie null
   (le script bascule alors sur le générateur générique, toujours varié). */
function makeCycler(pool){
  const queue = shuffle(pool); let idx = 0;
  return function next(){ return idx < queue.length ? queue[idx++] : null; };
}
function poolFor(species, bracket){
  if(species==='navi'){
    if(bracket==='jeunesse') return NAVI_JEUNESSE;
    if(bracket==='adulte') return NAVI_ADULTE;
    return NAVI_ANCIEN;
  }
  if(bracket==='jeunesse') return HUMAN_JEUNESSE;
  if(bracket==='adulte') return HUMAN_ADULTE;
  return HUMAN_ANCIEN;
}
function yearMode(tier){
  if(tier==='moyen') return 'auto';
  if(tier==='normal') return Math.random()<0.5 ? 'full' : 'auto';
  if(tier==='long') return Math.random()<0.8 ? 'full' : 'auto';
  if(tier==='immersif') return 'full';
  return 'auto';
}

function buildLifeScript(trunkStages, species, tier, startAge, endAge){
  if(startAge > endAge) return [];
  if(tier==='court'){
    return trunkStages.filter(s=> s.milestone && s.age>=startAge && s.age<=endAge);
  }
  const milestones = {};
  trunkStages.forEach(s=>{ if(s.age>=startAge && s.age<=endAge) milestones[s.age]=s; });
  const cyclers = { jeunesse: makeCycler(poolFor(species,'jeunesse')), adulte: makeCycler(poolFor(species,'adulte')), ancien: makeCycler(poolFor(species,'ancien')) };
  const babies = makeCycler(babyPool(species));
  const toddlers = makeCycler(toddlerPool(species));
  let result = [];
  for(let age=startAge; age<=endAge; age++){
    if(milestones[age]){ result.push(milestones[age]); continue; }
    if(age<=2){
      const b = babies();
      if(b) result.push(Object.assign({}, b, {id:'baby_'+species+'_'+age, age}));
      continue;
    }
    if(age<=5){
      const t = toddlers();
      if(t) result.push(Object.assign({}, t, {id:'tod_'+species+'_'+age, age}));
      continue;
    }
    const bracket = age<18 ? 'jeunesse' : age<=55 ? 'adulte' : 'ancien';
    const mode = yearMode(tier);
    if(mode==='auto'){
      result.push({id:'auto_'+age, age, auto:true, tier:'filler'});
    } else {
      const f = cyclers[bracket]();
      result.push(f ? Object.assign({}, f, {id:f.id+'_'+age, age}) : {id:'genericplaceholder_'+age, age, generic:true, bracket, tier:'filler'});
    }
  }
  return result;
}

/* ============================= FIN DE VIE ============================= */

function autoChildren(state, count){
  const pool = state.species==='navi' ? CHILD_NAMES_NAVI : CHILD_NAMES_HUMAN;
  for(let i=0;i<count;i++){ state.family.children.push(pick(pool)); }
}
function finalizeFamily(state){
  const kids = state.family.children.filter(c=>typeof c==='string' && c.startsWith('@AUTO'));
  if(kids.length){
    state.family.children = state.family.children.filter(c=>!(typeof c==='string'&&c.startsWith('@AUTO')));
    kids.forEach(k=>{ const n=parseInt(k.replace('@AUTO','')); autoChildren(state,n); });
  }
}
function dominantStat(state){
  let best='force', bv=-1;
  STAT_KEYS.forEach(k=>{ if(state.stats[k]>bv){bv=state.stats[k]; best=k;} });
  return best;
}

function buildTitleAndEpilogue(state){
  let title, epilogue;
  const dom = dominantStat(state);
  if(!state.alive){
    title = "Parti(e) trop tôt";
    epilogue = `${state.name} est mort(e) à ${state.age} ans. ${state.deathText||''}`;
  } else if(state.flags.chef){
    title = "Chef de Clan";
    epilogue = `${state.name} a fini par diriger le clan tout entier, porté(e) par ${EPITHETS[dom]} jusqu'au bout.`;
  } else if(state.flags.tsahik){
    title = "Voix d'Eywa";
    epilogue = `${state.name} est devenu(e) Tsahìk, la voix spirituelle du clan, avec ${EPITHETS[dom]} en plus.`;
  } else if(state.flags.devenuNavi){
    title = "Devenu(e) Na'vi";
    epilogue = `Né(e) humain(e), ${state.name} a fini par devenir pleinement Na'vi. Une vie peu ordinaire, portée par ${EPITHETS[dom]}.`;
  } else if(state.flags.ikranEpique){
    title = "Cavalier(ère) de Légende";
    epilogue = `On se souviendra longtemps du jour où ${state.name} a dompté son Ikran de cette façon. ${EPITHETS[dom]} y est pour beaucoup.`;
  } else if(state.flags.deserteur){
    title = "Déserteur de la RDA";
    epilogue = `${state.name} a tout risqué pour rejoindre le Peuple. Un choix tenu grâce à ${EPITHETS[dom]}.`;
  } else if(state.flags.loyalRDA){
    title = "Officier de la RDA";
    epilogue = `${state.name} est resté(e) fidèle à la Compagnie jusqu'au bout, porté(e) surtout par ${EPITHETS[dom]}.`;
  } else if(state.flags.paixLocale){
    title = "Négociateur(trice) de Paix";
    epilogue = `${state.name} a pris des risques pour éviter le pire, des deux côtés du conflit. ${EPITHETS[dom]} y a beaucoup contribué.`;
  } else if(state.flags.avatarTardif){
    title = "Arrivé(e) sur le Tard";
    epilogue = `${state.name} a découvert Pandora tardivement, mais pleinement. Comme quoi il n'est jamais trop tard, avec ${EPITHETS[dom]}.`;
  } else if(state.flags.ermite){
    title = "Ermite";
    epilogue = `${state.name} a préféré la tranquillité de la forêt aux responsabilités du clan, avec ${EPITHETS[dom]} pour seule compagnie.`;
  } else if(state.flags.quitPandora){
    title = "Retourné(e) sur Terre";
    epilogue = `${state.name} a fini par tourner le dos à Pandora, en emportant ${EPITHETS[dom]} avec lui/elle.`;
  } else if(state.flags.secretAlly || state.flags.secretLove){
    title = "Allié(e) Discret(ète)";
    epilogue = `${state.name} a agi dans l'ombre toute sa vie, plus fidèle à ses convictions qu'à un camp. ${EPITHETS[dom]} lui a permis de tenir.`;
  } else if(state.family.children.length>=3){
    title = "Chef de Famille Nombreuse";
    epilogue = `${state.name} laisse derrière lui/elle une grande famille, et ${EPITHETS[dom]} comme héritage.`;
  } else if(state.score>=350){
    title = "Une Légende de Pandora";
    epilogue = `${state.name} a tant vécu que son nom dépasse déjà celui de son propre clan, grâce à ${EPITHETS[dom]}.`;
  } else if(state.reputation>=40){
    title = "Personne Respectée";
    epilogue = `${state.name} laisse derrière lui/elle une réputation solide, construite grâce à ${EPITHETS[dom]}.`;
  } else if(state.reputation<=-20){
    title = "Personne Mal Vue";
    epilogue = `${state.name} n'a jamais brillé aux yeux des autres, mais est resté(e) fidèle à ${EPITHETS[dom]}.`;
  } else if(state.stats.force>=75){
    title = "Force de la Nature";
    epilogue = `${state.name} restera dans les mémoires pour sa force peu commune. ${EPITHETS[dom]}, tout simplement.`;
  } else if(state.stats.sagesse>=75){
    title = "Sage Reconnu(e)";
    epilogue = `${state.name} a marqué les esprits par ${EPITHETS[dom]}, jusqu'à la fin.`;
  } else if(state.stats.chance>=75){
    title = "Chanceux(se)";
    epilogue = `${state.name} semble avoir traversé la vie porté(e) par ${EPITHETS[dom]}, plus que la moyenne.`;
  } else {
    title = "Une Vie Tranquille";
    epilogue = `${state.name} a mené une vie simple et sincère sur Pandora, avec ${EPITHETS[dom]} comme fil conducteur.`;
  }
  const famTxt = state.family.married
    ? ` Marié(e) à ${state.family.spouseName}${state.family.children.length? ', '+ (state.family.children.length>1?"parent de "+state.family.children.length+" enfants ("+state.family.children.join(', ')+")":"parent d'un enfant ("+state.family.children[0]+")") : ", sans enfant"}.`
    : (state.family.children.length ? ` Parent solo de ${state.family.children.join(', ')}.` : " Cette vie n'aura pas connu de conjoint ou conjointe.");
  epilogue += famTxt;
  epilogue += ` Score final : ${state.score} points.`;
  if(state.tier==='immersif' || state.tier==='long'){
    epilogue += ` Au total, ${state.history.length} moments auront marqué cette vie, un par un.`;
  }
  return {title, epilogue};
}

/* ---- Sauvegarde .json (export / import) ---- */
function exportSave(){
  const data = {
    app: 'avatar-life-of-pandora',
    version: 1,
    exportedAt: Date.now(),
    current: JSON.parse(localStorage.getItem('eywa_current')||'null'),
    memoires: JSON.parse(localStorage.getItem('eywa_memoires')||'[]'),
    titles: JSON.parse(localStorage.getItem('eywa_titles')||'{}'),
  };
  try{
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const stamp = new Date().toISOString().slice(0,10);
    a.download = `avatar-life-of-pandora-sauvegarde-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  } catch(e){
    alert("Le fichier n'a pas pu être généré sur cet appareil.");
  }
}
function triggerImport(){
  const input = document.getElementById('importFileInput');
  if(input) input.click();
}
function handleImportFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    let data;
    try{ data = JSON.parse(e.target.result); }
    catch(err){ alert("Ce fichier n'est pas une sauvegarde valide."); input.value=''; return; }
    if(!data || (data.memoires===undefined && data.titles===undefined && data.current===undefined)){
      alert("Ce fichier ne correspond pas à une sauvegarde reconnue.");
      input.value=''; return;
    }
    const ok = confirm("Importer cette sauvegarde va remplacer tes vies enregistrées, tes titres et ta partie en cours sur cet appareil. Continuer ?");
    if(!ok){ input.value=''; return; }
    if(data.current) localStorage.setItem('eywa_current', JSON.stringify(data.current)); else localStorage.removeItem('eywa_current');
    localStorage.setItem('eywa_memoires', JSON.stringify(data.memoires||[]));
    localStorage.setItem('eywa_titles', JSON.stringify(data.titles||{}));
    input.value='';
    STATE = null;
    renderTitle();
  };
  reader.onerror = function(){ alert("Impossible de lire ce fichier."); input.value=''; };
  reader.readAsText(file);
}

/* Étape courante, avec injections dynamiques (amour / devenir Na'vi) mises en cache
   pour rester stables entre l'affichage et la résolution du choix. */
function currentStage(){
  const pos = STATE.scriptPos;
  if(_dynCache.pos===pos && _dynCache.stage !== undefined){ return _dynCache.stage; }
  const base = STATE.script[pos];
  let result = base;
  if(base && !base.milestone){
    if(base.generic){
      result = genericYearStage(STATE, base.age, base.bracket);
    }
    const lastLove = STATE.flags.lastLoveAttemptAge || -99;
    const lastNavi = STATE.flags.lastNaviAttemptAge || -99;
    if(!STATE.family.married && STATE.flags.seekingLove!==false && base.age>=20 && base.age<=65 && (base.age-lastLove)>=3 && Math.random()<0.22){
      result = makeLoveRetryStage(STATE, base.age);
    } else if(STATE.species==='humain' && STATE.flags.a7Attempted && !STATE.flags.devenuNaviDecided && base.age > (STATE.flags.a7Age||999) && (base.age-lastNavi)>=3 && Math.random()<0.22){
      result = makeBecomeNaviRetryStage(STATE, base.age);
    }
  }
  _dynCache = {pos, stage: result};
  return result;
}


function recapBlock(){
  const famLine = STATE.family.married

    : (STATE.family.children.length? STATE.family.children.length+' enfant(s), célibataire' : "Célibataire pour l'instant");
  const statLine = STAT_KEYS.map(k=>`${STAT_LABELS[k]} <b style="color:var(--text)">${STATE.stats[k]}</b>`).join(' · ');
  const pathLine = STATE.flags.archetypeLabel ? `<div class="recap-line">Voie : <b>${STATE.flags.archetypeLabel}</b></div>` : '';
  return `
    <div class="recap">
      <div class="recap-title">Bilan de l'année</div>
      <div class="recap-line">Âge : <b>${STATE.age} ans</b> (espérance de vie : <b>${STATE.maxAge} ans</b>) · Réputation : <b>${STATE.reputation>=0?'+':''}${STATE.reputation}</b> · Points : <b>${STATE.score}</b></div>
      <div class="recap-line">${famLine}</div>
      ${pathLine}
      <div class="recap-stats">${statLine}</div>
    </div>
  `;
}

function renderStage(){
  saveCurrent();
  setSpeciesTheme(STATE.species);
  if(!STATE.alive){ return renderEnd(); }
  const stage = currentStage();
  if(!stage){ return renderEnd(); }
  if(stage.age > STATE.maxAge){ STATE.age = STATE.maxAge; return renderEnd(); }
  STATE.age = stage.age;
  if(stage.auto){ return renderAutoYear(stage); }
  const text = typeof stage.text==='function' ? stage.text(STATE) : stage.text;
  const choices = getChoices(stage, STATE);
  render(`

    ${choices.map((c,i)=>{

      return `<button class="btn" onclick="makeChoice(${i})">${label}${pct}</button>`;

function renderAutoYear(stage){
  const flavor = autoFlavor(STATE);
  const k = pick(STAT_KEYS); const d = randInt(-1,2);
  STATE.stats[k] = clamp(STATE.stats[k]+d);
  STATE.score = Math.round((STATE.score||0) + d);
  pushHistory(STATE, `${flavor}`);
  saveCurrent();
  render(`

}

function makeChoice(i){
  const stage = currentStage();
  const choices = getChoices(stage, STATE);
  const choice = choices[i];
  const result = resolveChoice(STATE, stage, choice);
  finalizeFamily(STATE);
  saveCurrent();
  renderOutcome(stage, result);
}

function renderOutcome(stage, result){
  setSpeciesTheme(STATE.species);
  const deltaPills = Object.keys(result.deltas||{}).map(k=>{
    const v = result.deltas[k];
    return `<span class="delta-pill ${v>=0?'pos':'neg'}">${STAT_LABELS[k]} ${v>=0?'+':''}${v}</span>`;
  }).join('');
  render(`
    ${topPanel()}
    <div class="outcome ${result.success?'':'fail'}">
      <b>${result.success? '✓ Réussite' : '✗ Échec'}</b><br>${result.text}
      <div class="deltas">${deltaPills}</div>
    </div>
    ${recapBlock()}
    ${result.dead ? `<button class="btn danger" onclick="renderEnd()">Voir la suite</button>` : `<button class="btn primary" onclick="afterChoice()">Continuer →</button>`}
    ${journalHtml()}
  `);
}

function afterChoice(){
  STATE.scriptPos++;
  _dynCache = {pos:-1, stage:null};
  if(STATE.needsNaviRebuild){
    STATE.needsNaviRebuild = false;
    const kept = STATE.script.slice(0, STATE.scriptPos);
    const rest = buildLifeScript([], 'navi', STATE.tier, STATE.age+1, STATE.maxAge);
    STATE.script = kept.concat(rest);
  }
  if(STATE.scriptPos >= STATE.script.length){
    if(STATE.species==='humain' && !STATE.flags.branched && STATE.flags.path && STATE.age < STATE.maxAge){
      STATE.flags.branched = true;
      const trunk = STATE.flags.path==='avatar'? buildAvatarTrunk() : STATE.flags.path==='militaire'? buildMilitaryTrunk() : buildCivilTrunk();
      const branchScript = buildLifeScript(trunk, STATE.species, STATE.tier, STATE.age+1, STATE.maxAge);
      STATE.script = STATE.script.concat(branchScript);
      return continueScript();
    }
    if(STATE.age < STATE.maxAge){
      const extra = buildLifeScript([], STATE.species, STATE.tier, STATE.age+1, STATE.maxAge);
      STATE.script = STATE.script.concat(extra);
      return continueScript();
    }
    return renderEnd();
  }
  continueScript();
}
function continueScript(){
  if(STATE.scriptPos >= STATE.script.length){ return renderEnd(); }
  if(STATE.tier==='court'){ return renderTransition(); }
  renderStage();
}

function renderTransition(){
  const flavor = autoFlavor(STATE);
  const driftKey = pick(STAT_KEYS);
  const drift = randInt(-1,2);
  STATE.stats[driftKey] = clamp(STATE.stats[driftKey]+drift);
  const nextStage = STATE.script[STATE.scriptPos];
  const nextAge = nextStage ? nextStage.age : STATE.maxAge;
  render(`
    ${topPanel()}
    <div class="card center">
      <div class="small">— le temps passe —</div>
      <div style="margin:14px 0; font-size:15px; line-height:1.6;">${flavor}</div>
      <div class="small">Prochaine étape : ${nextAge} ans</div>
    </div>
    <button class="btn primary" onclick="jumpToNextStage(${nextAge})">Continuer →</button>
  `);
}
function jumpToNextStage(age){
  STATE.age = age;
  const stage = currentStage();
  if(!stage){ return renderEnd(); }
  renderStage();
}

    const s = document.createElement('div');
    s.className='spore';
    const size = randInt(3,7);
    s.style.width=size+'px'; s.style.height=size+'px';
    s.style.left = randInt(0,100)+'%';
    s.style.setProperty('--dx', randInt(-60,60)+'px');
    s.style.animationDuration = randInt(14,28)+'s';
    s.style.animationDelay = randInt(0,20)+'s';
    c.appendChild(s);
  }
}

/* ---- Boot ---- */
initSpores();
renderTitle();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
